<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5E9DA">
<title>The Agent Café</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5E9DA;
    --ink: #3D2E24;
    --ink-soft: #7A6556;
    --card: rgba(255, 250, 243, 0.74);
    --card-border: rgba(255, 255, 255, 0.85);
    --shadow: 0 8px 28px rgba(92, 60, 30, 0.14), 0 1px 3px rgba(92, 60, 30, 0.08);
    --chip: rgba(255, 255, 255, 0.92);
    --live: #22B573;
    --warn: #E9A23B;
    --demo: #9B87E8;
    --font: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #scene {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    display: block;
    touch-action: none;
    outline: none;
    cursor: grab;
  }
  #scene:active { cursor: grabbing; }

  /* ---------- HUD ---------- */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    backdrop-filter: blur(14px) saturate(1.3);
    border-radius: 20px;
  }
  .top {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    left: calc(12px + env(safe-area-inset-left));
    right: calc(12px + env(safe-area-inset-right));
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .title-card { padding: 12px 16px 12px; max-width: 360px; }
  .title-card h1 {
    margin: 0; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; line-height: 1.1;
  }
  .title-card h1 .cup { display: inline-block; width: 0.95em; height: 0.95em; vertical-align: -0.12em; margin-right: 6px; }
  .title-card p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-soft); font-weight: 500; }
  .demo-banner {
    display: none; margin-top: 8px;
    font-size: 12px; font-weight: 600; color: #5B4AB0;
    background: rgba(155, 135, 232, 0.16); border-radius: 999px; padding: 3px 10px; width: fit-content;
  }
  body.is-demo .demo-banner { display: block; }
  .conn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 13px; border-radius: 999px;
    font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .conn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); position: relative; }
  .conn[data-mode="live"] .dot { background: var(--live); }
  .conn[data-mode="live"] .dot::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--live); opacity: 0; animation: ping 2s ease-out infinite;
  }
  .conn[data-mode="demo"] .dot { background: var(--demo); }
  @keyframes ping { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }

  .bottom {
    position: absolute;
    left: calc(12px + env(safe-area-inset-left));
    right: calc(12px + env(safe-area-inset-right));
    bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 7px;
  }
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    padding: 8px 10px; max-width: 760px;
  }
  .legend .total { font-weight: 700; font-size: 13px; padding: 3px 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip); border-radius: 999px; padding: 3px 10px 3px 8px;
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    box-shadow: 0 1px 2px rgba(92, 60, 30, 0.08);
  }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .chip b { font-weight: 700; }
  .footer {
    font-size: 11.5px; color: var(--ink-soft); font-weight: 500;
    background: rgba(255, 250, 243, 0.6); border-radius: 999px; padding: 3px 12px;
    text-align: center;
  }

  /* ---------- floating labels ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .tag {
    position: absolute; left: 0; top: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    will-change: transform, opacity;
    transition: opacity .35s ease;
  }
  .tag .bubble {
    display: none; font-weight: 700; line-height: 1;
  }
  .tag[data-bubble="chat"] .bubble::after, .tag[data-bubble="think"] .bubble::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 7px; height: 7px; background: #fff; border-radius: 50%; transform: translateX(-50%); }
  .tag[data-bubble="chat"] .bubble { display: block; background: #fff; color: #C9875A; font-size: 15px; padding: 2px 9px 6px; border-radius: 12px; position: relative; box-shadow: 0 2px 6px rgba(92, 60, 30, .15); }
  .tag[data-bubble="think"] .bubble {
    display: block; background: #fff; color: #7C5CD6; font-size: 15px;
    padding: 2px 9px 6px; border-radius: 12px; position: relative;
    box-shadow: 0 2px 6px rgba(92, 60, 30, .15);
    animation: think 1.6s ease-in-out infinite;
  }
  .tag[data-bubble="think"] .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -4px; width: 7px; height: 7px;
    background: #fff; border-radius: 50%; transform: translateX(-50%);
  }
  .tag[data-bubble="wait"] .bubble {
    display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: #F87171; color: #fff; font-size: 15px;
    box-shadow: 0 2px 8px rgba(248, 113, 113, .5);
    animation: bounce .8s cubic-bezier(.3,.7,.4,1) infinite alternate;
  }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-7px); } }
  @keyframes think { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  .tag .name {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255, 255, 255, 0.93); color: var(--ink);
    font-size: 12.5px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px;
    box-shadow: 0 2px 6px rgba(92, 60, 30, .16); white-space: nowrap;
  }
  .tag .name i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; transition: background-color .4s; }
  .tag .state {
    font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.18);
    transition: background-color .4s;
  }
  body.compact .tag .state { display: none; }
  body.compact .tag .name { font-size: 11px; padding: 1px 7px 1px 5px; }
  body.compact .tag .name i { width: 7px; height: 7px; }

  @media (max-width: 520px) {
    .top { flex-direction: row; }
    .title-card { padding: 10px 13px; flex: 1; min-width: 0; }
    .title-card h1 { font-size: 18.5px; }
    .title-card p { font-size: 12px; }
    .conn { padding: 7px 10px; font-size: 12px; }
    .legend { padding: 6px 8px; gap: 4px; }
    .chip { font-size: 11px; padding: 2px 8px 2px 6px; }
    .legend .total { font-size: 11.5px; }
    .footer { font-size: 10.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tag[data-bubble="wait"] .bubble, .tag[data-bubble="think"] .bubble,
    .conn[data-mode="live"] .dot::after { animation: none; }
    .tag { transition: none; }
  }
  .noscript {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene" aria-label="A 3D café where each AI agent sits at a table"></canvas>
<div id="labels" aria-hidden="true"></div>

<div class="hud">
  <div class="top">
    <div class="card title-card">
      <h1><svg class="cup" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z" fill="#C9875A"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16" fill="none" stroke="#C9875A" stroke-width="2"/><path d="M8 3.5c-.8 1 .8 2 0 3M11.5 3.5c-.8 1 .8 2 0 3" stroke="#B9A08C" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>The Agent Café</h1>
      <p>What my agents are up to, live</p>
      <div class="demo-banner">Demo — not connected</div>
    </div>
    <div class="card conn" id="conn" data-mode="connecting" role="status" aria-live="polite">
      <span class="dot"></span><span id="conn-text">Connecting…</span>
    </div>
  </div>
  <div class="bottom" id="bottom">
    <div class="card legend" id="legend" aria-live="polite"></div>
    <div class="footer">Status only: no code, prompts or files are shared.</div>
  </div>
</div>

<noscript><div class="noscript">The Agent Café needs JavaScript to show the live scene.</div></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
