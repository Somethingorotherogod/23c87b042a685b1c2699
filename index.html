<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#E6EDF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121925" media="(prefers-color-scheme: dark)">
<title>The Agent Café</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #E6EDF5;
    --ink: #1D1D1F;
    --ink-soft: #6E6E73;
    --card: rgba(255, 255, 255, 0.62);
    --card-strong: rgba(255, 255, 255, 0.86);
    --card-border: rgba(255, 255, 255, 0.75);
    --hairline: rgba(0, 0, 0, 0.08);
    --shadow: 0 10px 30px rgba(20, 40, 80, 0.12), 0 1px 2px rgba(20, 40, 80, 0.08);
    --highlight: inset 0 1px 0 rgba(255, 255, 255, 0.85);
    --chip: rgba(255, 255, 255, 0.72);
    --accent: #007AFF;
    --accent-grad: linear-gradient(180deg, #61C7FF 0%, #007AFF 100%);
    --accent-soft: rgba(0, 122, 255, 0.12);
    --live: #34C759;
    --warn: #FF9F0A;
    --demo: #0A84FF;
    --tip-bg: rgba(255, 255, 255, 0.82);
    --tip-ink: #1D1D1F;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121925;
      --ink: #F5F5F7;
      --ink-soft: #A1A1A6;
      --card: rgba(36, 40, 48, 0.58);
      --card-strong: rgba(40, 44, 54, 0.88);
      --card-border: rgba(255, 255, 255, 0.14);
      --hairline: rgba(255, 255, 255, 0.1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.3);
      --highlight: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      --chip: rgba(255, 255, 255, 0.1);
      --accent: #0A84FF;
      --accent-soft: rgba(10, 132, 255, 0.22);
      --tip-bg: rgba(30, 34, 42, 0.86);
      --tip-ink: #F5F5F7;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-feature-settings: "cv11", "ss01";
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #scene {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    display: block;
    touch-action: none;
    outline: none;
    cursor: grab;
  }
  #scene:active { cursor: grabbing; }

  /* ---------- HUD (Liquid Glass cards) ---------- */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow), var(--highlight);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    backdrop-filter: blur(24px) saturate(1.8);
    border-radius: 22px;
  }
  .top {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    left: calc(12px + env(safe-area-inset-left));
    right: calc(12px + env(safe-area-inset-right));
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .title-card { padding: 12px 16px 12px 12px; max-width: 380px; display: flex; gap: 11px; align-items: flex-start; }
  .title-card .icon { flex: none; width: 42px; height: 42px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }
  .title-card .txt { min-width: 0; }
  .title-card h1 {
    margin: 0; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; line-height: 1.15;
  }
  .title-card p { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); font-weight: 500; letter-spacing: -0.005em; }
  .demo-banner {
    display: none; margin-top: 7px;
    font-size: 11.5px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; width: fit-content;
  }
  body.is-demo .demo-banner { display: block; }
  .conn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); position: relative; }
  .conn[data-mode="live"] .dot { background: var(--live); }
  .conn[data-mode="live"] .dot::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--live); opacity: 0; animation: ping 2s ease-out infinite;
  }
  .conn[data-mode="demo"] .dot { background: var(--accent-grad); }
  @keyframes ping { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }

  .bottom {
    position: absolute;
    left: calc(12px + env(safe-area-inset-left));
    right: calc(12px + env(safe-area-inset-right));
    bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 7px;
  }
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    padding: 8px 10px; max-width: 780px;
  }
  .legend .total { font-weight: 700; font-size: 13px; padding: 3px 8px; letter-spacing: -0.01em; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--chip); border-radius: 999px; padding: 3px 10px 3px 8px;
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    border: 0.5px solid var(--hairline);
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip b { font-weight: 700; color: var(--accent); }
  .footer {
    font-size: 11.5px; color: var(--ink-soft); font-weight: 500;
    background: var(--card); border: 0.5px solid var(--hairline); border-radius: 999px; padding: 3px 12px;
    -webkit-backdrop-filter: blur(16px) saturate(1.6); backdrop-filter: blur(16px) saturate(1.6);
    text-align: center;
  }

  /* ---------- floating labels ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .tag {
    position: absolute; left: 0; top: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    will-change: transform, opacity;
    transition: opacity .35s ease;
  }
  .tag .bubble { display: none; position: relative; font-weight: 700; line-height: 1; }
  .tag .bubble .bang, .tag .bubble .btxt, .tag .bubble .dots { display: none; }
  .tag[data-bubble="wait"] .bubble {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255, 255, 255, 0.95); color: #D70015; font-size: 12px; padding: 3px 10px 3px 3px; border-radius: 999px;
    box-shadow: 0 3px 10px rgba(255, 59, 48, .35);
    animation: bounce .8s cubic-bezier(.3,.7,.4,1) infinite alternate;
  }
  .tag[data-bubble="wait"] .bang {
    display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(180deg, #FF6961, #FF3B30); color: #fff; font-size: 12px;
  }
  .tag[data-bubble="wait"] .btxt { display: inline; white-space: nowrap; }
  .tag[data-bubble="dots"] .bubble, .tag[data-bubble="chat"] .bubble {
    display: block; background: rgba(255, 255, 255, 0.92); padding: 6px 9px; border-radius: 12px;
    box-shadow: 0 3px 10px rgba(20, 40, 80, .2); border: 0.5px solid rgba(0, 0, 0, 0.06);
  }
  .tag[data-bubble="dots"] .bubble::after, .tag[data-bubble="chat"] .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -4px; width: 7px; height: 7px;
    background: rgba(255, 255, 255, 0.92); border-radius: 50%; transform: translateX(-50%);
  }
  .tag[data-bubble="dots"] .dots, .tag[data-bubble="chat"] .dots { display: flex; gap: 3px; }
  .tag .dots i { width: 6px; height: 6px; border-radius: 50%; background: #8E8E93; animation: dot 1s ease-in-out infinite; }
  .tag[data-bubble="chat"] .dots i { background: #007AFF; }
  .tag .dots i:nth-child(2) { animation-delay: .15s; }
  .tag .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  .tag .name {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255, 255, 255, 0.88); color: #1D1D1F;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 12px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; letter-spacing: -0.01em;
    box-shadow: 0 2px 8px rgba(20, 40, 80, .16); border: 0.5px solid rgba(0, 0, 0, 0.06); white-space: nowrap;
  }
  .tag .name i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; transition: background-color .4s; }
  .tag .state {
    font-size: 10.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 4px rgba(20, 40, 80, .18);
    transition: background-color .4s;
  }
  body.compact .tag .state { display: none; }
  body.compact .tag .name { font-size: 11px; padding: 1px 7px 1px 5px; }
  body.compact .tag .name i { width: 6px; height: 6px; }

  @media (max-width: 520px) {
    .top { flex-direction: row; }
    .title-card { padding: 9px 12px 9px 9px; flex: 1; min-width: 0; gap: 9px; }
    .title-card .icon { width: 34px; height: 34px; border-radius: 8px; }
    .title-card h1 { font-size: 17px; }
    .title-card p { font-size: 11.5px; }
    .conn { padding: 7px 11px; font-size: 12px; }
    .legend { padding: 6px 8px; gap: 4px; }
    .chip { font-size: 11px; padding: 2px 8px 2px 6px; }
    .legend .total { font-size: 11.5px; }
    .footer { font-size: 10.5px; }
  }
  /* ---------- hover tooltip + popup card ---------- */
  .tip {
    position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none;
    background: var(--tip-bg); color: var(--tip-ink); border-radius: 12px;
    -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
    border: 0.5px solid var(--hairline);
    padding: 6px 11px 7px; font-size: 12.5px; font-weight: 500; line-height: 1.3;
    box-shadow: 0 8px 24px rgba(20, 40, 80, .2); white-space: nowrap;
  }
  .tip b { display: block; font-weight: 700; font-size: 13.5px; letter-spacing: -0.01em; }
  .tip span { color: var(--ink-soft); }
  .tip[hidden], .pop[hidden] { display: none; }
  .pop {
    position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none;
    width: max-content; max-width: min(260px, calc(100vw - 16px));
    padding: 12px 15px 13px; border-radius: 18px;
    background: var(--card-strong); color: var(--ink);
    -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8);
    border: 1px solid var(--card-border);
    box-shadow: 0 14px 40px rgba(20, 40, 80, .24), var(--highlight);
  }
  .pop .pop-name { font-weight: 700; font-size: 16px; line-height: 1.15; letter-spacing: -0.015em; }
  .pop .pop-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 13px; font-weight: 600; }
  .pop .pop-row i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pop .pop-time { color: var(--ink-soft); font-weight: 500; }
  .pop .pop-desc { margin-top: 5px; font-size: 12.5px; color: var(--ink-soft); font-weight: 500; line-height: 1.35; }
  .pop .pop-hint {
    margin-top: 8px; font-size: 12px; font-weight: 600; color: #fff;
    background: var(--accent-grad); border-radius: 999px; padding: 4px 11px; width: fit-content;
    box-shadow: 0 3px 10px rgba(0, 122, 255, .3);
  }
  .pop .pop-hint[hidden] { display: none; }

  /* ---------- closed sign + demo toggle ---------- */
  .closed-sign {
    display: none; position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(84px + env(safe-area-inset-top));
    padding: 12px 24px 13px; text-align: center; white-space: nowrap;
    background: rgba(28, 36, 52, 0.62); color: #F5F5F7; border-radius: 20px;
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 14px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .closed-sign strong { display: block; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .closed-sign span { display: block; font-size: 13px; font-weight: 500; color: #A9C6E8; margin-top: 2px; }
  body.is-closed .closed-sign { display: block; }
  @media (min-width: 900px) { .closed-sign { top: calc(16px + env(safe-area-inset-top)); } }
  @media (max-width: 520px) {
    .closed-sign { padding: 9px 16px 10px; top: calc(100px + env(safe-area-inset-top)); }
    .closed-sign strong { font-size: 16.5px; }
    .closed-sign span { font-size: 11.5px; }
  }
  .demo-btn {
    display: none; pointer-events: auto; cursor: pointer;
    font: inherit; font-size: 12.5px; font-weight: 600; color: #fff; letter-spacing: -0.005em;
    background: var(--accent-grad); border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px; padding: 7px 16px;
    box-shadow: 0 6px 18px rgba(0, 122, 255, .32), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .demo-btn:hover { filter: brightness(1.06); box-shadow: 0 8px 22px rgba(0, 122, 255, .4), inset 0 1px 0 rgba(255,255,255,.45); }
  .demo-btn:active { transform: scale(0.97); }
  .demo-btn[aria-pressed="true"] { background: rgba(255,255,255,.72); color: var(--accent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .demo-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body.is-demo .demo-btn { display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    .tag[data-bubble="wait"] .bubble, .tag .dots i,
    .conn[data-mode="live"] .dot::after { animation: none; }
    .tag, .demo-btn { transition: none; }
  }
  .noscript {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene" aria-label="A 3D café where each AI agent sits at a table"></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="tip" id="tip" hidden><b id="tip-name"></b><span id="tip-state"></span></div>
<div class="pop" id="pop" role="dialog" aria-live="polite" hidden>
  <div class="pop-name" id="pop-name"></div>
  <div class="pop-row"><i id="pop-dot"></i><span id="pop-state"></span><span class="pop-time" id="pop-time"></span></div>
  <div class="pop-desc" id="pop-desc"></div>
  <div class="pop-hint" id="pop-hint" hidden></div>
</div>

<div class="hud">
  <div class="top">
    <div class="card title-card">
      <svg class="icon" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="gd-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#61C7FF"/><stop offset="1" stop-color="#007AFF"/></linearGradient><linearGradient id="gd-hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="64" height="64" rx="14.4" fill="url(#gd-bg)"/><rect width="64" height="34" rx="14.4" fill="url(#gd-hl)"/><rect x="12.8" y="17.3" width="16.9" height="8.8" rx="3.2" fill="#fff" fill-opacity=".78"/><rect x="12.8" y="20.2" width="38.4" height="26.5" rx="3.2" fill="#fff" fill-opacity=".78"/><rect x="12.8" y="24.9" width="38.4" height="21.8" rx="3.2" fill="#fff"/></svg>
      <div class="txt">
        <h1>The Agent Café</h1>
        <p>What my agents are up to, live</p>
        <div class="demo-banner">Demo — not connected</div>
      </div>
    </div>
    <div class="card conn" id="conn" data-mode="connecting" role="status" aria-live="polite">
      <span class="dot"></span><span id="conn-text">Connecting…</span>
    </div>
  </div>
  <div class="closed-sign" role="status"><strong>Coffee shop closed</strong><span>Out of usage for now</span></div>
  <div class="bottom" id="bottom">
    <button type="button" class="demo-btn" id="demo-close" aria-pressed="false">Close café (demo)</button>
    <div class="card legend" id="legend" aria-live="polite"></div>
    <div class="footer">Status only: no code, prompts or files are shared.</div>
  </div>
</div>

<noscript><div class="noscript">The Agent Café needs JavaScript to show the live scene.</div></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
